# ==============================================================================
# Eylül Çocuk Akademisi - Üretim Nginx Yapılandırması
# Core Web Vitals (LCP < 2.5s, CLS < 0.1), Yüksek Güvenlik ve Agresif Önbellekleme
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log Formatı (Performans ve Güvenlik İzleme)
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Temel Ağ ve Dosya Transfer Optimizasyonları (Hızlı TTFB)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # İstemci Yükleme Limitleri (Veli / Öğrenci Evrak ve Görsel Yüklemeleri)
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;

    # Zaman Aşımı Değerleri
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # ==========================================================================
    # GZIP & SIKIŞTIRMA (Bant Genişliği Tasarrufu ve Hızlı İlk Boyama - FCP/LCP)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ==========================================================================
    # HIZ SINIRLANDIRMA (Rate Limiting - DDoS ve Brute Force Koruması)
    # ==========================================================================
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_status 429;

    # ==========================================================================
    # UPSTREAM (Next.js Standalone Container)
    # ==========================================================================
    upstream nextjs_upstream {
        server anaokulu_app:3000;
        keepalive 64;
    }

    # ==========================================================================
    # SUNUCU BLOKLARI (HTTP & REVERSE PROXY)
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ----------------------------------------------------------------------
        # GÜVENLİK BAŞLIKLARI (OWASP Sertleştirmesi)
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ----------------------------------------------------------------------
        # SAĞLIK VE İZLEME (Healthcheck Endpoint)
        # ----------------------------------------------------------------------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # ----------------------------------------------------------------------
        # NEXT.JS STATİK VARLIKLARI (Agresif 1 Yıl Değişmez Önbellekleme)
        # Core Web Vitals LCP ve FCP için doğrudan en yüksek hızda sunulur
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Değişmez (Immutable) Önbellekleme
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # KALICI KULLANICI YÜKLEMELERİ (Uploads Volume)
        # Node.js'e girmeden doğrudan Nginx üzerinden sıfır gecikmeyle sunulur
        # ----------------------------------------------------------------------
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate";
            try_files $uri =404;
            access_log off;

            # Güvenlik: Yükleme klasöründe PHP veya betik çalıştırma engeli
            location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
                deny all;
            }
        }

        # ----------------------------------------------------------------------
        # STATİK MEDYA VE YAZI TİPLERİ (Fonts, Images, Icons)
        # ----------------------------------------------------------------------
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # API VE DİNAMİK İSTEKLER (Next.js API Routes & Server Actions)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffer optimizasyonları
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ----------------------------------------------------------------------
        # ANA DİNAMİK YÖNLENDİRME (Next.js SSR / Sayfalar)
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Core Web Vitals TTFB için proxy buffer ayarları
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            proxy_temp_file_write_size 256k;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
